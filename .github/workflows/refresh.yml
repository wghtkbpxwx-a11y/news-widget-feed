name: refresh-feed
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC); GitHub may delay a few minutes
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 build_feed.py
      - name: Commit if changed
        run: |
          git config user.name "feed-bot"; git config user.email "feed-bot@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || (git commit -m "refresh feed $(date -u +%FT%TZ)" && git push)
